name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
      - name: Set up Python
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: |
          pip install ruff mypy
          ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Run pytest (includes parser fuzzing)
        run: pytest

  panel:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
      - name: Set up Node
        uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "20"
      - name: Check panel syntax
        run: node --check custom_components/homesec/frontend/homesec-panel.js
      - name: Run panel escaping tests
        run: node --test tests/js/
