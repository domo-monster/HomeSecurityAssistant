name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
      - name: Set up Python
        uses: "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065" # v5.6.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: |
          pip install ruff mypy
          ruff check .
      - name: Type check (mypy)
        run: mypy
      - name: Run pytest (includes parser fuzzing)
        run: pytest

  panel:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683" # v4.2.2
      - name: Set up Node
        uses: "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020" # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Committed bundle matches the sources
        run: npm run check-bundle
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        # DOM snapshots are platform independent; pixel screenshots depend on
        # the fonts of the machine that made the baselines, so skip them here.
        env:
          SKIP_SCREENSHOTS: "1"
        run: npm test
      - name: Upload test report on failure
        if: failure()
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
        with:
          name: playwright-results
          path: frontend/test-results
